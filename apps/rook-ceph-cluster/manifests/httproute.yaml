# S3 from outside the cluster over HTTPS (path-style: https://s3.lab.mpopov.net/<bucket>)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-s3-httproute
  namespace: rook-ceph
spec:
  hostnames:
  - s3.lab.mpopov.net
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
    namespace: networking
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: rook-ceph-rgw-ceph-s3
      port: 7480
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
