# External mode (upstream values-external.yaml): Ceph runs on the Proxmox hosts and
# Rook only connects to it. Connection details and cephx keys come from Rook's
cephClusterSpec:
  external:
    enable: true 
  crashCollector:
    disable: true

# Pools, filesystems and object stores are managed on the Proxmox side
cephBlockPools: []
cephFileSystems: []
cephObjectStores: []