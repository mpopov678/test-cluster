apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitlab-db
  namespace: gitlab
spec:
  instances: 1
  # GitLab 19 requires PostgreSQL 17; the CNPG 1.30 default is 18
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie
  storage:
    size: 10Gi

  postgresql:
    parameters:
      # GitLab's schema load (one transaction) exceeds the default of 64
      max_locks_per_transaction: "512"

  bootstrap:
    initdb:
      database: gitlabhq_production
      owner: gitlab
      secret:
        name: gitlab-secret