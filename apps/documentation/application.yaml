apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: documentation
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/mpopov678/test-cluster.git
      targetRevision: main
      path: apps/documentation/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: documentation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # keep retrying failed syncs (e.g. CRDs from another app not installed yet);
    # automated sync never retries a failed commit on its own
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
