apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Envoy Gateway CRDs only; Gateway API CRDs are installed by hand
    # (standard channel v1.6.2), the chart bundles v1.6.1 and would downgrade them
    - repoURL: docker.io/envoyproxy
      chart: gateway-crds-helm
      targetRevision: v1.9.3
      helm:
        valuesObject:
          crds:
            gatewayAPI:
              enabled: false
            envoyGateway:
              enabled: true
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.3
      helm:
        valueFiles:
          - $values/apps/envoy-gateway/values.yaml
    - repoURL: https://github.com/mpopov678/test-cluster.git
      targetRevision: main
      ref: values
      path: apps/envoy-gateway/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # keep retrying failed syncs (e.g. CRDs from another app not installed yet);
    # automated sync never retries a failed commit on its own
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
