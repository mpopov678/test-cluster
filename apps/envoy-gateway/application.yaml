apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Envoy Gateway CRDs only; Gateway API CRDs are installed by hand
    # (standard channel v1.6.2), the chart bundles v1.6.1 and would downgrade them
    - repoURL: docker.io/envoyproxy
      chart: gateway-crds-helm
      targetRevision: v1.9.3
      helm:
        valuesObject:
          crds:
            gatewayAPI:
              enabled: false
            envoyGateway:
              enabled: true
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.3
      helm:
        valueFiles:
          - $values/apps/envoy-gateway/values.yaml
    # Grafana dashboards only (ConfigMap grafana-dashboards, picked up by the
    # victoria-metrics Grafana sidecar); every bundled subchart switched off
    - repoURL: docker.io/envoyproxy
      chart: gateway-addons-helm
      targetRevision: v1.9.3
      helm:
        valuesObject:
          dashboard:
            labels:
              grafana_dashboard: "1"
          grafana:
            enabled: false
          prometheus:
            enabled: false
          loki:
            enabled: false
          tempo:
            enabled: false
          fluent-bit:
            enabled: false
          alloy:
            enabled: false
          opentelemetry-collector:
            enabled: false
    - repoURL: https://github.com/mpopov678/test-cluster.git
      targetRevision: main
      ref: values
      path: apps/envoy-gateway/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # keep retrying failed syncs (e.g. CRDs from another app not installed yet);
    # automated sync never retries a failed commit on its own
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
