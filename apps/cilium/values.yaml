# Helm values for cilium 1.20.2 (release "cilium", ns kube-system).
# Installed by hand with Helm 2026-10-01, adopted by Argo CD 2026-11-17: these are the
# release's user-supplied values at adoption, plus the Hubble TLS method below.

k8sServiceHost: 192.168.88.100 # kube-vip API VIP
k8sServicePort: 6443
k8sClientRateLimit:
  qps: 10
  burst: 100

kubeProxyReplacement: true

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16

l2announcements:
  enabled: true

# Envoy Gateway serves Gateway API since 2026-11-12
gatewayAPI:
  enabled: false
  enableAlpn: true
  enableAppProtocol: true

# The chart forces these to true only while gatewayAPI is enabled; keep them on
socketLB:
  hostNamespaceOnly: true
bpf:
  lbAlgorithmAnnotation: true

# Metrics: the chart's ServiceMonitors are converted by the VictoriaMetrics operator.
# Dashboards go to `monitoring`: Grafana's sidecar only watches its own namespace.

# cilium-agent metrics (:9962 on each node)
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
dashboards:
  enabled: true
  namespace: monitoring

operator:
  prometheus:
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
    namespace: monitoring

envoy:
  prometheus:
    serviceMonitor:
      enabled: true

hubble:
  tls:
    auto:
      # "helm" (the default) builds the CA via lookup, which Argo CD can't do: every render
      # would mint a new CA and certs. certgen reuses the existing cilium-ca Secret and
      # reissues the Hubble certs from it (Job now, CronJob every 4 months).
      method: cronJob
  # flow API across all nodes + web UI (no route: kubectl port-forward svc/hubble-ui)
  relay:
    enabled: true
  ui:
    enabled: true
  # Hubble flow metrics (:9965 on each node). Namespace labels feed the chart's
  # "Hubble / ... (Namespace)" dashboards; workload contexts on flow/icmp show who talks to whom.
  # No httpV2: needs L7 policies, so the "L7 HTTP" dashboard stays empty.
  metrics:
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - port-distribution:labelsContext=source_namespace,destination_namespace
      - icmp:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
      - flow:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
      namespace: monitoring
