# Hubble UI (no auth, LAN only): https://hubble.lab.mpopov.net
# external-dns creates the record from this route (source gateway-httproute)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  hostnames:
    - hubble.lab.mpopov.net
  parentRefs:
    - name: eg
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
      # the UI streams flows over long-lived requests; Envoy's default 15s route timeout would cut them
      timeouts:
        request: 0s
