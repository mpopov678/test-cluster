apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: v1.11.2
      helm:
        valueFiles:
          - $values/apps/longhorn/values.yaml
    - repoURL: https://github.com/mpopov678/test-cluster.git
      targetRevision: main
      ref: values
      path: apps/longhorn/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # keep retrying failed syncs (e.g. CRDs from another app not installed yet);
    # automated sync never retries a failed commit on its own
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
