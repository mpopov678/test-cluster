# Valkey redis_exporter sidecar (Service valkey-metrics:9121)
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: valkey
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - valkey
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
---
# CloudNativePG instances in any namespace (exporter :9187, port name "metrics")
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg
  namespace: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
# Argo CD (plain manifests in bootstrap/argocd, no chart ServiceMonitors). Every
# Argo CD Service with a port named "metrics": application-controller (argocd-metrics),
# server, repo-server, applicationset-controller, notifications-controller.
# dex is unconfigured (no SSO), so nothing listens on its metrics port
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: argocd
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [argocd-dex-server]
  endpoints:
    - port: metrics
---
# Envoy Gateway controller (/metrics :19001); gateway-helm ships no ServiceMonitor
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: envoy-gateway
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      control-plane: envoy-gateway
  podMetricsEndpoints:
    - port: metrics
---
# Envoy proxies of Gateway eg (/stats/prometheus :19001)
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: envoy-proxy
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
---
# Proxmox Ceph: mgr prometheus module (:9283) on every Ceph host. Only the active
# mgr serves metrics; standbys answer /metrics with an empty 200 (stay up=1).
# Constant instance label keeps series continuous across mgr failovers;
# honorLabels keeps the per-OSD `instance` (host) label on ceph_disk_occupation.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ceph
  namespace: monitoring
spec:
  jobName: ceph
  targetEndpoints:
    - targets:
        - 192.168.88.5:9283
        - 192.168.88.6:9283
        - 192.168.88.7:9283
      honorLabels: true
      relabelConfigs:
        - targetLabel: instance
          replacement: ceph
