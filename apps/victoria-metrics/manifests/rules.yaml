# Lab-specific alerts for apps whose charts ship no rules
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: lab-apps
  namespace: monitoring
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertificateNotReady
          expr: max by (namespace, name) (certmanager_certificate_ready_status{condition="False"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
        - alert: CertificateExpiringSoon
          expr: (min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) - time()) < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }} (renewal should have happened at 30 days)"
        - alert: CertificateExpiringSoon
          expr: (min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) - time()) < 3 * 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
    - name: argocd
      rules:
        - alert: ArgoCDAppUnhealthy
          expr: max by (name) (argocd_app_info{health_status!~"Healthy|Progressing"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD app {{ $labels.name }} is {{ with $labels.health_status }}{{ . }}{{ else }}not healthy{{ end }}"
        - alert: ArgoCDAppOutOfSync
          expr: max by (name) (argocd_app_info{sync_status!="Synced"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD app {{ $labels.name }} has been out of sync for 30 minutes"
    - name: data-services
      rules:
        - alert: PostgresInstanceDown
          expr: cnpg_collector_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG instance {{ $labels.namespace }}/{{ $labels.pod }} cannot reach PostgreSQL"
        - alert: ValkeyDown
          expr: redis_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Valkey in {{ $labels.namespace }} is down"
    - name: external-dns
      rules:
        - alert: ExternalDNSSyncStale
          expr: time() - external_dns_controller_last_sync_timestamp_seconds > 15 * 60
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "external-dns has not synced DNS records for over 15 minutes"
---
# Proxmox Ceph (scraped from the mgr prometheus module, job "ceph")
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: ceph
  namespace: monitoring
spec:
  groups:
    - name: ceph
      rules:
        # standbys stay up=1 with no data, so watch for the data itself
        - alert: CephMetricsMissing
          expr: absent(ceph_health_status)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "No Ceph metrics: mgr prometheus module down or not reachable on :9283"
        - alert: CephHealthError
          expr: ceph_health_status == 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Ceph is HEALTH_ERR"
        # one alert per active health check (OSD_DOWN, MON_DOWN, PG_DEGRADED, SLOW_OPS,
        # *_NEARFULL, MON_CLOCK_SKEW, TOO_MANY_PGS, ...); all group into one notification
        - alert: CephHealthCheck
          expr: ceph_health_detail == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Ceph health check {{ $labels.name }} active ({{ $labels.severity }})"
        - alert: CephPGsInactive
          expr: sum(ceph_pg_total) - sum(ceph_pg_active) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value }} Ceph PGs are not active: I/O to them is blocked"
        - alert: CephRawUsageHigh
          expr: ceph_cluster_total_used_raw_bytes / ceph_cluster_total_bytes > 0.70
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Ceph raw usage at {{ $value | humanizePercentage }} (OSD nearfull is 85%)"
        # all pools are size 3; mon refuses new pools / PG growth past mon_max_pg_per_osd (250).
        # 225 at time of writing (2026-11-17)
        - alert: CephPGBudgetHigh
          expr: 3 * sum(ceph_pg_total) / count(ceph_osd_in == 1) > 230
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Ceph at {{ $value }} PG replicas per OSD (mon_max_pg_per_osd 250)"
