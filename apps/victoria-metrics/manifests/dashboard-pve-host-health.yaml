# Grafana dashboard for the Proxmox hosts' NVMe health and patch status
# (prometheus-node-exporter-collectors textfile metrics). Loaded by the Grafana
# sidecar via the grafana_dashboard label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-pve-host-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pve-host-health.json: |
    {
      "uid": "pve-host-health",
      "title": "Proxmox Hosts / NVMe & Patches",
      "tags": [
        "proxmox",
        "nvme",
        "apt"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "editable": false,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics",
              "value": "VictoriaMetrics"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "NVMe health",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "table",
          "title": "NVMe drives",
          "description": "From each drive's SMART log. Wear used = vendor estimate of rated endurance consumed. Critical warning: any non-zero bit (spare, temperature, reliability, read-only) is set by the drive.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 24,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device, model, firmware) (nvme_device_info) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "A",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_percentage_used_ratio) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "B",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_available_spare_ratio) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "C",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_media_errors_total) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "D",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_critical_warning) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "E",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_temperature_celsius) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "F",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_data_units_written_total * 512000) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "G",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_power_on_hours_total) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "H",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_unsafe_shutdowns_total) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "I",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_num_err_log_entries_total) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "J",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "nodename",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "instance": true,
                  "device": true,
                  "job": true,
                  "cluster": true,
                  "__name__": true
                },
                "renameByName": {
                  "nodename": "Host",
                  "model": "Model",
                  "firmware": "Firmware",
                  "Value #A": "info",
                  "Value #B": "Wear used",
                  "Value #C": "Spare left",
                  "Value #D": "Media errors",
                  "Value #E": "Critical warning",
                  "Value #F": "Temp",
                  "Value #G": "Written",
                  "Value #H": "Power-on",
                  "Value #I": "Unsafe shutdowns",
                  "Value #J": "Error-log entries"
                },
                "indexByName": {
                  "nodename": 0
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "info"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Wear used"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 0.7
                        },
                        {
                          "color": "red",
                          "value": 0.8
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Spare left"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 0.2
                        },
                        {
                          "color": "green",
                          "value": 0.5
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Media errors"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Critical warning"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Written"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Power-on"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "h"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Unsafe shutdowns"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Error-log entries"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Host",
                "desc": false
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "NVMe temperature",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (nvme_temperature_celsius) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "A",
              "legendFormat": "{{nodename}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "NVMe writes per day",
          "description": "Host-written bytes per day (6h rate). Every VM disk and the Ceph OSD share this drive.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 7,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (rate(nvme_data_units_written_total[6h]) * 512000 * 86400) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "A",
              "legendFormat": "{{nodename}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Unsafe shutdowns / error-log entries (increase per day)",
          "description": "Unsafe shutdown = power lost without a clean NVMe shutdown.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (increase(nvme_unsafe_shutdowns_total[1d])) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "A",
              "legendFormat": "{{nodename}} unsafe shutdowns"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (increase(nvme_num_err_log_entries_total[1d])) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "B",
              "legendFormat": "{{nodename}} error-log entries"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "row",
          "title": "Patch status",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "table",
          "title": "Pending updates",
          "description": "From apt_info.py every 15 min. Counts are as fresh as the package lists (PVE refreshes them daily).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance) (apt_upgrades_pending) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "A",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance) (apt_upgrades_pending{origin=~\".*security.*\"}) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "B",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance) (apt_upgrades_pending{origin=~\"Proxmox.*\"}) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "C",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance) (node_reboot_required) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "D",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance) (apt_autoremove_pending) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "E",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance) (time() - apt_package_cache_timestamp_seconds) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "F",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "nodename",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "instance": true,
                  "device": true,
                  "job": true,
                  "cluster": true,
                  "__name__": true
                },
                "renameByName": {
                  "nodename": "Host",
                  "Value #A": "All pending",
                  "Value #B": "Security",
                  "Value #C": "Proxmox repo",
                  "Value #D": "Reboot required",
                  "Value #E": "Autoremove",
                  "Value #F": "Package lists age"
                },
                "indexByName": {
                  "nodename": 0
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Security"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Reboot required"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "no",
                            "color": "green"
                          },
                          "1": {
                            "text": "yes",
                            "color": "orange"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Package lists age"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Host",
                "desc": false
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "Pending updates over time",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance) (apt_upgrades_pending) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "A",
              "legendFormat": "{{nodename}} all"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance) (apt_upgrades_pending{origin=~\".*security.*\"}) * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)",
              "refId": "B",
              "legendFormat": "{{nodename}} security"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
