apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mpopov678/test-cluster.git
    path: apps
    targetRevision: main
    # only pick up apps/<name>/application.yaml; each Application deploys its own values/manifests
    directory:
      recurse: true
      include: '*/application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    # Argo adds these to apps whose charts have PreDelete hooks (e.g. victoria-metrics)
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - '.metadata.finalizers[] | select(startswith("pre-delete-finalizer.argocd.argoproj.io"))'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # keep the ignored finalizers on sync instead of stripping them
    syncOptions:
      - RespectIgnoreDifferences=true
